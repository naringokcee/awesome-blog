<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Narin Gökçe</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Senin CSS Dosyan -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- Navigasyon Menüsü (Ortak Siyah Navbar) -->
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container">
            <a href="/index.html" class="navbar-brand d-flex align-items-center">
                <img src="/img/logo8.png" class="wid me-2" alt="Logo" style="width: 30px; height: auto;">
                <span class="fw-semibold">Narin Gökçe</span>
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mobile">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div id="mobile" class="collapse navbar-collapse">
<ul class="navbar-nav me-auto mb-2 mb-md-0 gap-1 align-items-center">
    <li class="nav-item">
        <!-- Ana sayfa için sadece slash (/) yeterli -->
        <a href="/" class="nav-link {% if page.url == '/' %}active{% endif %}">Ana Sayfa</a>
    </li>
    <li class="nav-item">
        <a href="/blog/" class="nav-link {% if page.url contains '/blog/' %}active{% endif %}">Blog Yazılarım</a>
    </li>
    <li class="nav-item">
        <a href="/hakkimda/" class="nav-link {% if page.url contains '/hakkimda/' %}active{% endif %}">Hakkımda</a>
    </li>
    <li class="nav-item">
        <a href="/iletisim/" class="nav-link {% if page.url contains '/iletisim/' %}active{% endif %}">İletişim</a>
    </li>
</ul>
                <!-- Arama Çubuğu & Tema Butonu -->
                <div class="d-flex align-items-center gap-3">
                    <div class="search-box-wrapper">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" class="search-input" placeholder="Ara...">
                    </div>
                    <button id="dark-mode-toggle" type="button" class="btn p-2 text-white" title="Temayı Değiştir">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Dinamik İçerik Buraya Gelecek -->
    {{ content }}

    <!-- Footer (Ortak) -->
    <footer class="py-4 border-top text-center text-muted" style="font-size: 0.8rem; background-color: #fafafa;">
        <div class="container">
            <p class="mb-0">© 2026 Narin Gökçe. Tüm Hakları Saklıdır.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
